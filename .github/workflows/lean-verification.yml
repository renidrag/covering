name: Lean verification

on:
  push:
    # Skip only reader-documentation and citation changes on branch pushes.
    # Unknown paths, proof/data/tool changes and mixed pushes still verify.
    # Tag pushes are not path-filtered by GitHub.
    paths-ignore:
      - 'CITATION.cff'
      - 'README.md'
      - 'RESULTS.md'
      - 'RESULTS.json'
      - 'RELEASE_HISTORY.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'technical-details.md'
      - 'coverings/**/*.md'
  # Keep PR checks unconditional so required checks cannot remain pending.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Verification tools and controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Check verification tools and record controls
        run: |
          ./covering run --name workflow-tests --timeout 900 --no-memory-guard -- \
            python3 -B -m unittest discover -s tests -v
          ./covering controls audit --no-memory-guard

      - name: Retain verification-tool records and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/commands/
          if-no-files-found: warn
          retention-days: 30

  proofs:
    name: Fresh Lean proofs and audits
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Select the pinned toolchain for root-level commands
        shell: bash
        run: |
          read -r covering_toolchain < lean/lean-toolchain
          printf 'ELAN_TOOLCHAIN=%s\n' "$covering_toolchain" >> "$GITHUB_ENV"

      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Install checksum-verified dependency sources
        run: >-
          ./covering run --name dependency-sources --timeout 300 --no-memory-guard --
          python3 scripts/setup_dependencies.py

      - name: Build the Mathlib cache downloader
        run: >-
          ./covering run --name build-mathlib-cache --timeout 600 --no-memory-guard --
          lake -d lean build cache

      - name: Fetch only the imported dependency artifacts
        shell: bash
        run: |
          ./covering run --name fetch-mathlib-cache --timeout 900 --no-memory-guard -- \
            lake -d lean env python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          lean = root / 'lean'
          pins = {p['name']: p for p in json.loads((lean / 'dependencies.json').read_text())['packages']}
          mathlib = lean / 'vendor' / pins['mathlib']['directory']
          assert (lean / 'lean-toolchain').read_text().strip() == (mathlib / 'lean-toolchain').read_text().strip()
          package_links = mathlib / '.lake/packages'
          package_links.mkdir(parents=True, exist_ok=True)
          for dep in json.loads((mathlib / 'lake-manifest.json').read_text())['packages']:
              assert dep['type'] == 'git'
              repo = dep['url'].removeprefix('https://github.com/').removesuffix('.git')
              assert pins[dep['name']]['url'] == f"https://codeload.github.com/{repo}/tar.gz/{dep['rev']}"
              # Upstream cache archives use Mathlib's standard package paths.
              (package_links / dep['name']).symlink_to(lean / 'vendor' / pins[dep['name']]['directory'],
                                                      target_is_directory=True)

          sources = [*(lean / 'CoveringDesigns').rglob('*.lean'), *(lean / 'audits').glob('*.lean')]
          imports = {m for p in sources for m in re.findall(r'^import\s+([\w.]+)\s*$', p.read_text(), re.M)}
          modules = sorted(m for m in imports if m.split('.')[0] not in {'CoveringDesigns', 'Init', 'Lean', 'Std'})
          assert modules, 'No external imports found'
          # Run inside Mathlib: its upstream manifest uses Git revisions, whereas
          # our manifest uses paths to the same checksum-verified archive sources.
          # Keep Lake's search paths absolute when changing the working directory.
          env = os.environ.copy()
          env['LEAN_SRC_PATH'] = os.pathsep.join(str(Path(p).resolve()) for p in env['LEAN_SRC_PATH'].split(os.pathsep))
          subprocess.run([str(mathlib / '.lake/build/bin/cache'), 'get',
                          '--repo=leanprover-community/mathlib4', '--cache-from=master', *modules],
                         cwd=mathlib, env=env, check=True)
          PYCODE

      - name: Check prerequisites and source data
        run: |
          ./covering doctor --no-memory-guard
          ./covering check

      - name: Rebuild every project proof and run the Lean audits
        run: ./covering verify --workers 1 --no-memory-guard --memory-mib 6144 --build-timeout 300 --audit-timeout 60

      - name: Validate the verification records
        run: ./covering audit

      - name: Retain verification records and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lean-proof-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/library-verification.json
            results/runs/
            results/commands/
          if-no-files-found: warn
          retention-days: 30

  # Preserve the existing required-check name. This gate succeeds only after
  # fresh compilation/audits AND all verification-tool controls have passed.
  verify:
    name: Lean proofs and audits
    needs: [proofs, tools]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful fresh proofs and verification-tool checks
        env:
          PROOFS_RESULT: ${{ needs.proofs.result }}
          TOOLS_RESULT: ${{ needs.tools.result }}
        run: test "$PROOFS_RESULT" = success && test "$TOOLS_RESULT" = success
